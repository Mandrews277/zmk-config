# SPI Configuration
CONFIG_SPI=y

# Input and Pointing Device Support
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# PMW3610 ALT Driver
CONFIG_PMW3610_ALT=y
# Batch motion reports every 8ms to reduce noise sensitivity and prevent
# spurious cursor movement when the trackball is idle. 0 causes immediate
# reporting of every tiny sensor blip (desk vibration, electrical noise).
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=14
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

# Power Management - PM_DEVICE required for SPI/trackball power states
CONFIG_PM_DEVICE=y
CONFIG_ZMK_SLEEP=n

# Explicitly enable USB HID output (required for OUT_TOG to have a USB target)
CONFIG_ZMK_USB=y

# Increase BT transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
